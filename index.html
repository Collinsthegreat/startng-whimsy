<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start.ng Arcade — Play Nigerian & African Indie Games</title>
    <meta
      name="description"
      content="Whimsical micro-arcade for Start.ng featuring 2-second playable cultural riddles, interactive mascot attire, and 3D tactile game cartridges."
    />
    <meta property="og:title" content="Start.ng Arcade — Play Nigerian & African Indie Games" />
    <meta property="og:description" content="2-second playable cultural micro-arcade with procedural Nigerian percussion and 3D retro cartridges." />
    <meta name="theme-color" content="#d8fd71" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var saved = localStorage.getItem('startng-theme');
        var theme = saved || 'light';
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
