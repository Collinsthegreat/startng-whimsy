<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start.ng Arcade — Play Nigerian & African Indie Games</title>
    <meta
      name="description"
      content="Whimsical micro-arcade for Start.ng featuring 2-second playable cultural riddles, interactive mascot attire, and 3D tactile game cartridges including ROOTS 3D by Abuchi Collins Nwajagu."
    />
    <meta property="og:title" content="Start.ng Arcade — Play Nigerian & African Indie Games" />
    <meta property="og:description" content="2-second playable cultural micro-arcade with procedural Nigerian percussion and 3D retro cartridges." />
    <meta name="theme-color" content="#d8fd71" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d8fd71'/%3E%3Cpath d='M18 4L8 18h7l-3 10 12-14h-7l4-10z' fill='%23292a23'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var saved = localStorage.getItem('startng-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
